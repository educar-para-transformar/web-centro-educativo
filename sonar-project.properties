sonar.projectKey=web-centro-educativo
sonar.projectName=Web Centro Educativo
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,functions/src
sonar.tests=src,cypress
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,cypress/**/*.cy.js

sonar.exclusions=node_modules/**,dist/**,coverage/**,functions/lib/**,src/test/**,cypress/videos/**,cypress/screenshots/**,cypress/downloads/**
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,src/test/**,cypress/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.node.maxspace=4096
